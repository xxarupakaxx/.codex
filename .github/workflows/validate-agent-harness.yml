name: Validate agent harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/validate-agent-harness.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/roadmap-viewer.test.mjs
      - run: bash -n claude-compat/hooks/*.sh
