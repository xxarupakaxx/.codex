<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <title>Plan Viewer - MCP App</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1eee4;
      --sheet: #fffdf7;
      --ink: #1b211d;
      --muted: #626960;
      --line: #c9cbc0;
      --line-strong: #202620;
      --green: #23684f;
      --green-soft: #e4eee7;
      --red: #b7453b;
      --red-dark: #91332b;
      --code: #17201b;
      --focus: #0b67c1;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(32, 38, 32, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 38, 32, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    button,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible,
    [tabindex="-1"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .container {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(0, 760px) minmax(220px, 300px);
      justify-content: center;
      align-items: start;
      gap: 20px;
      width: min(100%, 1400px);
      margin: 0 auto;
      padding: 24px;
    }

    .viewer-header {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      min-height: 116px;
      padding: 22px 0 18px;
      border-top: 5px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

    .eyebrow,
    .panel-kicker,
    .document-label {
      margin: 0 0 6px;
      color: var(--green);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .viewer-header h1 {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      background: var(--sheet);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      content: "";
    }

    .status.connected {
      border-color: var(--green);
      color: var(--green);
    }

    .status.connected::before {
      background: var(--green);
    }

    #plan-outline,
    #plan-review {
      position: sticky;
      top: 24px;
      border-top: 3px solid var(--line-strong);
      background: rgba(255, 253, 247, 0.86);
      backdrop-filter: blur(10px);
    }

    #plan-outline {
      padding: 18px 16px 16px;
    }

    #plan-outline h2,
    #plan-review h2 {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.2;
    }

    #outline-list {
      margin: 18px 0;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      list-style: none;
    }

    #outline-list:empty::before {
      display: block;
      color: var(--muted);
      content: "見出しを待っています";
      font-size: 0.78rem;
    }

    #outline-list li + li {
      margin-top: 2px;
    }

    #outline-list button {
      width: 100%;
      min-height: 44px;
      padding: 8px 6px;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.35;
      text-align: left;
      transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease;
    }

    #outline-list .outline-subitem button {
      padding-left: 18px;
      color: var(--muted);
      font-weight: 500;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin: 0;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .progress-grid div {
      padding: 9px 6px;
      background: var(--sheet);
      text-align: center;
    }

    .progress-grid dt {
      color: var(--muted);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .progress-grid dd {
      margin: 2px 0 0;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
    }

    #progress-meter {
      width: 100%;
      height: 5px;
      margin-top: 12px;
      border: 0;
      background: var(--line);
      accent-color: var(--green);
    }

    #progress-meter::-webkit-progress-bar {
      background: var(--line);
    }

    #progress-meter::-webkit-progress-value {
      background: var(--green);
    }

    #plan-document {
      min-width: 0;
      border-top: 5px solid var(--green);
      background: var(--sheet);
      box-shadow: 0 16px 40px rgba(32, 38, 32, 0.08);
    }

    .document-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 28px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #content {
      counter-reset: section;
      padding: clamp(28px, 6vw, 64px);
      overflow-wrap: anywhere;
    }

    #content > :first-child {
      margin-top: 0;
    }

    #content > :last-child {
      margin-bottom: 0;
    }

    #content h1 {
      max-width: 16ch;
      margin: 0 0 1.2em;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(2rem, 5vw, 3.7rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.02;
    }

    #content h2 {
      counter-increment: section;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 12px;
      margin: 2.5em 0 0.8em;
      padding-top: 14px;
      border-top: 1px solid var(--line-strong);
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 600;
      line-height: 1.2;
      scroll-margin-top: 24px;
    }

    #content h2::before {
      color: var(--green);
      content: counter(section, decimal-leading-zero);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      line-height: 2;
    }

    #content h3 {
      margin: 2em 0 0.65em;
      color: var(--green);
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.01em;
      scroll-margin-top: 24px;
    }

    #content h4,
    #content h5,
    #content h6 {
      margin: 1.6em 0 0.55em;
    }

    #content p,
    #content ul,
    #content ol,
    #content blockquote,
    #content pre,
    #content .table-wrap {
      margin: 0 0 1.25em;
    }

    #content ul,
    #content ol {
      padding-left: 1.4em;
    }

    #content li + li {
      margin-top: 0.35em;
    }

    #content a {
      color: var(--green);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    #content blockquote {
      padding: 16px 18px;
      border-left: 4px solid var(--green);
      background: var(--green-soft);
      color: #35423a;
    }

    #content blockquote > :last-child {
      margin-bottom: 0;
    }

    #content code {
      padding: 0.15em 0.35em;
      background: #e8e5dc;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.88em;
    }

    #content pre {
      max-width: 100%;
      padding: 18px;
      overflow-x: auto;
      border-top: 4px solid var(--green);
      background: var(--code);
      color: #eef3ec;
      line-height: 1.55;
    }

    #content pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .table-wrap {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
    }

    #content table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    #content th,
    #content td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    #content th {
      background: #ebe8de;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    #plan-review {
      padding: 18px 16px 16px;
    }

    .review-copy {
      margin: 10px 0 16px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .comment-form {
      display: grid;
      gap: 10px;
    }

    .comment-form label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .comment-form textarea {
      width: 100%;
      min-height: 128px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      background: var(--sheet);
      color: var(--ink);
      line-height: 1.5;
    }

    .comment-form textarea::placeholder {
      color: #858b83;
    }

    .comment-form button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--red);
      border-radius: 0;
      background: var(--red);
      color: white;
      cursor: pointer;
      font-weight: 750;
      transition: background-color 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    .comment-form button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .comment-form button:disabled {
      border-color: var(--line);
      background: #d8d7d0;
      color: #777c76;
      cursor: not-allowed;
    }

    #comments-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .comment {
      padding: 10px 0 10px 12px;
      border-left: 3px solid var(--green);
      color: #384039;
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .comment-time {
      margin-top: 5px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.65rem;
    }

    .loading {
      min-height: 240px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    @media (hover: hover) and (pointer: fine) {
      #outline-list button:hover {
        border-left-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
      }

      .comment-form button:hover:not(:disabled) {
        border-color: var(--red-dark);
        background: var(--red-dark);
      }
    }

    @media (max-width: 1100px) {
      .container {
        grid-template-columns: minmax(180px, 220px) minmax(0, 1fr);
      }

      #plan-review {
        position: static;
        grid-column: 2;
      }
    }

    @media (max-width: 720px) {
      .container {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
      }

      .viewer-header {
        grid-template-columns: 1fr;
        min-height: 0;
        padding: 16px 0;
      }

      .viewer-header h1 {
        font-size: clamp(2.25rem, 15vw, 3.6rem);
      }

      .status {
        justify-self: start;
      }

      #plan-outline,
      #plan-review {
        position: static;
        grid-column: 1;
      }

      #plan-document {
        grid-column: 1;
      }

      #content {
        padding: 28px 20px 36px;
      }

      #content h2 {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .document-bar {
        padding-inline: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="viewer-header">
      <div>
        <p class="eyebrow">Workflow / source-bound</p>
        <h1>計画を読む</h1>
      </div>
      <span id="status" class="status" role="status" aria-live="polite">内容待ち</span>
    </header>

    <nav id="plan-outline" aria-labelledby="outline-heading">
      <p class="panel-kicker">Document map</p>
      <h2 id="outline-heading">この計画の構造</h2>
      <ol id="outline-list"></ol>
      <dl class="progress-grid" aria-label="計画の進捗">
        <div><dt>完了</dt><dd id="progress-complete">0</dd></div>
        <div><dt>全項目</dt><dd id="progress-total">0</dd></div>
        <div><dt>残り</dt><dd id="progress-remaining">0</dd></div>
      </dl>
      <progress id="progress-meter" max="1" value="0" aria-label="計画の完了率"></progress>
    </nav>

    <main id="plan-document">
      <div class="document-bar" aria-hidden="true">
        <span>Plan / live document</span>
        <span>Read → inspect → respond</span>
      </div>
      <div id="content">
        <div class="loading">計画の Markdown を待っています</div>
      </div>
    </main>

    <aside class="comment-section" id="plan-review" aria-labelledby="review-heading">
      <p class="panel-kicker">Review channel</p>
      <h2 id="review-heading">計画へコメント</h2>
      <p class="review-copy">判断、懸念、修正依頼を計画の文脈へ返します。</p>
      <div class="comment-form">
        <label for="comment-input">Review note</label>
        <textarea id="comment-input" placeholder="例：Task 2 の検証条件を具体化して" aria-describedby="comment-help"></textarea>
        <span id="comment-help" class="review-copy">空欄では送信できません。</span>
        <button id="send-btn" type="button" disabled>コメントを送る</button>
      </div>
      <div id="comments-list" aria-live="polite"></div>
    </aside>
  </div>

  <script type="module">
    import { marked } from 'marked';
    import DOMPurify from 'dompurify';

    // 信頼するオリジンのホワイトリスト
    const TRUSTED_ORIGINS = [
      'https://claude.ai',
      'https://www.claude.ai',
      'vscode-webview://',
      'file://'
    ];

    // オリジン検証関数
    function isTrustedOrigin(origin) {
      if (!origin) return false;
      return TRUSTED_ORIGINS.some(trusted => {
        if (trusted.endsWith('://')) {
          return origin.startsWith(trusted);
        }
        return origin === trusted;
      });
    }

    // MCP App client for bidirectional communication
    class MCPAppClient {
      constructor() {
        this.connected = false;
        this.pendingMessages = [];
        this.onContentReceived = null;
        this.parentOrigin = null;

        // Listen for messages from parent (Claude host)
        window.addEventListener('message', (event) => this.handleMessage(event));

        // Notify parent that we're ready
        this.sendToParent({ type: 'app-ready', name: 'Plan Viewer', version: '1.0.0' });
      }

      handleMessage(event) {
        // オリジン検証（CRITICAL: セキュリティ対策）
        if (!isTrustedOrigin(event.origin) && event.origin !== '') {
          console.warn(`Rejected message from untrusted origin: ${event.origin}`);
          return;
        }

        const data = event.data;
        if (!data || typeof data !== 'object') return;

        // 接続時に親オリジンを記録
        if (data.type === 'connected' && event.origin) {
          this.parentOrigin = event.origin;
        }

        switch (data.type) {
          case 'tool-result':
            // Received content from MCP server via host
            if (data.content && this.onContentReceived) {
              const textContent = data.content.find(c => c.type === 'text');
              if (textContent) {
                this.onContentReceived(textContent.text);
              }
            }
            break;

          case 'connected':
            this.connected = true;
            this.updateStatus(true);
            // Send any pending messages
            this.pendingMessages.forEach(msg => this.sendToParent(msg));
            this.pendingMessages = [];
            break;
        }
      }

      sendToParent(message) {
        if (window.parent !== window) {
          // 親オリジンが判明している場合はそれを使用、そうでなければ'*'
          // （初回接続時のみワイルドカード許容）
          const targetOrigin = this.parentOrigin || '*';
          window.parent.postMessage(message, targetOrigin);
        }
      }

      async sendComment(comment) {
        const message = {
          type: 'user-message',
          role: 'user',
          content: [{
            type: 'text',
            text: `[Plan Comment]\n${comment}`
          }]
        };

        if (this.connected) {
          this.sendToParent(message);
        } else {
          this.pendingMessages.push(message);
        }
      }

      updateStatus(connected) {
        const statusEl = document.getElementById('status');
        if (connected) {
          statusEl.textContent = '接続済み';
          statusEl.classList.add('connected');
        } else {
          statusEl.textContent = '未接続';
          statusEl.classList.remove('connected');
        }
        syncSendState();
      }
    }

    // Initialize
    const app = new MCPAppClient();
    const contentEl = document.getElementById('content');
    const commentInput = document.getElementById('comment-input');
    const sendBtn = document.getElementById('send-btn');
    const commentsList = document.getElementById('comments-list');

    // Local comments storage
    const comments = [];

    function countPlanTasks(markdown) {
      const tasks = markdown.match(/^\s*-\s+\[[ xX]\]/gm) || [];
      const complete = tasks.filter(task => /\[[xX]\]/.test(task)).length;
      return { complete, total: tasks.length };
    }

    function enhancePlanDocument(markdown) {
      const outline = document.getElementById('outline-list');
      outline.replaceChildren();
      const usedIds = new Map();
      contentEl.querySelectorAll('h2, h3').forEach((heading) => {
        const base = heading.textContent.trim().toLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, '-')
          .replace(/^-|-$/g, '') || 'section';
        const count = usedIds.get(base) || 0;
        usedIds.set(base, count + 1);
        heading.id = count ? `${base}-${count + 1}` : base;

        const item = document.createElement('li');
        item.className = heading.tagName === 'H3' ? 'outline-subitem' : '';
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = heading.textContent;
        button.addEventListener('click', () => {
          heading.scrollIntoView({ block: 'start' });
          heading.focus({ preventScroll: true });
        });
        heading.tabIndex = -1;
        item.appendChild(button);
        outline.appendChild(item);
      });

      const progress = countPlanTasks(markdown);
      document.getElementById('progress-complete').textContent = String(progress.complete);
      document.getElementById('progress-total').textContent = String(progress.total);
      document.getElementById('progress-remaining').textContent = String(progress.total - progress.complete);
      const meter = document.getElementById('progress-meter');
      meter.max = Math.max(progress.total, 1);
      meter.value = progress.complete;

      contentEl.querySelectorAll('table').forEach((table) => {
        if (table.parentElement.classList.contains('table-wrap')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrap';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    // Handle content from MCP server
    // CRITICAL: DOMPurifyでサニタイズしてXSSを防止
    app.onContentReceived = (markdown) => {
      const rawHtml = marked.parse(markdown);
      const sanitizedHtml = DOMPurify.sanitize(rawHtml, {
        ALLOWED_TAGS: ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'br', 'hr',
                       'ul', 'ol', 'li', 'a', 'strong', 'em', 'code', 'pre',
                       'blockquote', 'table', 'thead', 'tbody', 'tr', 'th', 'td',
                       'img', 'span', 'div'],
        ALLOWED_ATTR: ['href', 'src', 'alt', 'title', 'class', 'id'],
        ALLOW_DATA_ATTR: false,
        ADD_ATTR: ['target'],
      });
      contentEl.innerHTML = sanitizedHtml;
      enhancePlanDocument(markdown);
      app.updateStatus(true);
    };

    function syncSendState() {
      sendBtn.disabled = !commentInput.value.trim();
    }

    // Send comment
    sendBtn.addEventListener('click', async () => {
      const comment = commentInput.value.trim();
      if (!comment) return;

      // Add to local list
      const now = new Date().toLocaleTimeString();
      comments.push({ text: comment, time: now });

      // Update UI
      const commentEl = document.createElement('div');
      commentEl.className = 'comment';
      const commentText = document.createElement('div');
      commentText.textContent = comment;
      const commentTime = document.createElement('div');
      commentTime.className = 'comment-time';
      commentTime.textContent = `${now} / 送信済み`;
      commentEl.append(commentText, commentTime);
      commentsList.appendChild(commentEl);

      // Send to Claude
      await app.sendComment(comment);

      // Clear input
      commentInput.value = '';
      syncSendState();
    });

    // Enable send button when there's input
    commentInput.addEventListener('input', () => {
      syncSendState();
    });

    // Demo: simulate receiving content (for standalone testing)
    if (window.parent === window) {
      // Running standalone (not in iframe)
      document.getElementById('status').textContent = 'スタンドアロン';
      document.getElementById('status').classList.add('connected');

      // Show demo content
      const demoMarkdown = `# Demo Plan

## Overview
This is a demo of the Plan Viewer MCP App.
